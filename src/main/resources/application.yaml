spring:
  application:
    name: officinahub_api

  datasource:
    url: jdbc:postgresql://localhost:5432/officinahub00
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true
      locations: classpath:db/migration

  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: ${RESOURCE_SERVER_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
