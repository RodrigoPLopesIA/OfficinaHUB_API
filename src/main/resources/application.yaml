spring:
  application:
    name: officinahub_api

  datasource:
    url: jdbc:postgresql://localhost:5432/officinahub
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: false
      locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${RESOURCE_SERVER_JWK_SET_URI:https://awake-skink-66.clerk.accounts.dev/.well-known/jwks.json}
  actuator:
    endpoints:
      web:
        exposure:
          include: "*"